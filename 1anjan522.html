    <div class="container">
        <h1>Online Tender Submission</h1>
        <form action="submit_tender" method="post" enctype="multipart/form-data">
            <label for="company_name">Company Name:</label>
            <input type="text" id="company_name" name="company_name" required>

            <label for="contact_person">Contact Person:</label>
            <input type="text" id="contact_person" name="contact_person" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="tender_document">Upload Tender Document:</label>
            <input type="file" id="tender_document" name="tender_document" required>

            <label for="message">Additional Information:</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <input type="submit" value="Submit Tender">
        </form>
